<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حسابات</title>
    
    <!-- إعدادات الـ PWA خاصة بـ iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="حسابات">
    <meta name="theme-color" content="#0f172a">
    
    <!-- أيقونة الـ Apple Touch المضمنة (تظهر عند إضافته للشاشة الرئيسية) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><rect width=%22512%22 height=%22512%22 rx=%22115%22 fill=%22%230f172a%22/><path d=%22M256 90C164.3 90 90 164.3 90 256s74.3 166 166 166 166-74.3 166-166S347.7 90 256 90zm0 290c-68.4 0-124-55.6-124-124s55.6-124 124-124 124 55.6 124 124-55.6 124-124 124z%22 fill=%22%2338bdf8%22/><path d=%22M256 160c-53 0-96 43-96 96s43 96 96 96 96-43 96-96-43-96-96-96zm0 150c-30.3 0-55-24.7-55-55s24.7-55 55-55 55 24.7 55 55-24.7 55-55 55z%22 fill=%22%2334d399%22/><text x=%2250%25%22 y=%2253%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%22140%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22%23ffffff%22>💰</text></svg>">

    <!-- ربط ملف الـ Manifest الديناميكي -->
    <link rel="manifest" id="dynamic-manifest">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            --success: #34d399;
            --danger: #f87171;
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            padding-env: env(safe-area-inset-bottom);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-top: 10px;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .settings-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .settings-btn:active {
            transform: scale(0.95);
        }

        /* البطاقات */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 14px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .main-card {
            background: var(--accent-gradient);
            border: none;
            color: #fff;
            text-align: center;
            padding: 28px 20px;
        }

        .main-card .label {
            font-size: 0.95rem;
            opacity: 0.9;
            margin-bottom: 6px;
        }

        .main-card .value {
            font-size: 2.5rem;
            font-weight: 800;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 14px;
        }

        .mini-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
        }

        .mini-card .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .mini-card .value {
            font-size: 1.25rem;
            font-weight: 700;
        }

        /* زر الإضافة */
        .add-btn {
            width: 100%;
            background: #fff;
            color: var(--bg-color);
            border: none;
            padding: 16px;
            border-radius: var(--radius);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        .add-btn:active {
            transform: scale(0.98);
        }

        /* سجل الدفعات */
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-muted);
        }

        .payments-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 40px;
        }

        .payment-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .payment-info .amount {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 2px;
        }

        .payment-info .note {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .payment-info .date {
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.8;
        }

        .payment-actions {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
        }

        .delete-btn { color: var(--danger); }
        .edit-btn { color: var(--accent); }

        /* النوافذ المنبثقة */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px;
            border-top: 1px solid var(--card-border);
            animation: slideUp 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 1.2rem;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent);
        }

        .save-btn {
            width: 100%;
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 30px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الهيدر -->
        <header>
            <h1 id="person-title">حسابات</h1>
            <button class="settings-btn" onclick="openSettings()">الإعدادات ⚙️</button>
        </header>

        <!-- 1. البطاقة الرئيسية: إجمالي المبلغ -->
        <div class="card main-card">
            <div class="label">إجمالي المبلغ المحفوظ</div>
            <div class="value" id="total-amount">0 <span style="font-size: 1.2rem;">ر.س</span></div>
        </div>

        <!-- 2 و 3. بطاقات تفصيلية -->
        <div class="grid-2">
            <div class="mini-card">
                <div class="label">المتبقي لرمضان</div>
                <div class="value" id="days-to-ramadan">-- يوم</div>
            </div>
            <div class="mini-card">
                <div class="label">الهدف في رمضان</div>
                <div class="value" id="target-display">0 <span style="font-size: 0.8rem;">ر.س</span></div>
            </div>
        </div>

        <!-- 4. المتبقي للوصول للهدف -->
        <div class="card mini-card" style="margin-bottom: 14px;">
            <div class="label">المتبقي للوصول للهدف</div>
            <div class="value" id="remaining-to-target" style="color: var(--accent);">0 ر.س</div>
        </div>

        <!-- 5. الربح والمتوقع -->
        <div id="profit-section" style="display: none;">
            <div class="grid-2">
                <div class="mini-card">
                    <div class="label">الربح المتوقع</div>
                    <div class="value" id="expected-profit" style="color: var(--success);">0 ر.س</div>
                </div>
                <div class="mini-card">
                    <div class="label">المبلغ النهائي المتوقع</div>
                    <div class="value" id="final-expected-amount">0 ر.س</div>
                </div>
            </div>
        </div>

        <!-- زر إضافة دفعة -->
        <button class="add-btn" onclick="openAddModal()">+ إضافة دفعة جديدة</button>

        <!-- سجل الدفعات -->
        <div class="section-title">سجل الدفعات</div>
        <div class="payments-list" id="payments-list"></div>
    </div>

    <!-- نافذة إضافة / تعديل دفعة -->
    <div class="modal" id="payment-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">إضافة دفعة جديدة</h3>
                <button class="close-modal" onclick="closePaymentModal()">&times;</button>
            </div>
            <form id="payment-form" onsubmit="savePayment(event)">
                <input type="hidden" id="payment-id">
                <div class="form-group">
                    <label>مبلغ الدفعة (ر.س)</label>
                    <input type="number" step="any" id="pay-amount" class="form-control" required placeholder="أدخل المبلغ">
                </div>
                <div class="form-group">
                    <label>تاريخ الدفعة</label>
                    <input type="date" id="pay-date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>ملاحظة (اختيارية)</label>
                    <input type="text" id="pay-note" class="form-control" placeholder="مثل: دفعة شهر أغسطس">
                </div>
                <button type="submit" class="save-btn">حفظ الدفعة</button>
            </form>
        </div>
    </div>

    <!-- نافذة الإعدادات -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>إعدادات الاتفاق</h3>
                <button class="close-modal" onclick="closeSettings()">&times;</button>
            </div>
            <form id="settings-form" onsubmit="saveSettings(event)">
                <div class="form-group">
                    <label>اسم الشخص</label>
                    <input type="text" id="set-person" class="form-control" placeholder="اسم الشخص المسؤول عن المبلغ">
                </div>
                <div class="form-group">
                    <label>المبلغ المستهدف في رمضان (ر.س)</label>
                    <input type="number" id="set-target" class="form-control" placeholder="المبلغ المستهدف">
                </div>
                <div class="form-group">
                    <label>قيمة أو نسبة الربح المتفق عليها (اختياري)</label>
                    <input type="text" id="set-profit" class="form-control" placeholder="مثال: 10% أو 500">
                </div>
                <button type="submit" class="save-btn">حفظ الإعدادات</button>
            </form>
        </div>
    </div>

    <script>
        // إنشاء ملف Manifest ديناميكياً لضمان التعرف التام كـ PWA على آيفون
        const manifestData = {
            "name": "حسابات",
            "short_name": "حسابات",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#0f172a",
            "theme_color": "#0f172a",
            "icons": [
                {
                    "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><rect width=%22512%22 height=%22512%22 rx=%22115%22 fill=%22%230f172a%22/><text x=%2250%25%22 y=%2253%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%22140%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22%23ffffff%22>💰</text></svg>",
                    "sizes": "512x512",
                    "type": "image/svg+xml"
                }
            ]
        };
        const stringManifest = JSON.stringify(manifestData);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        document.getElementById('dynamic-manifest').setAttribute('href', URL.createObjectURL(blob));

        // نظام الحفظ المزدوج (LocalStorage + Backup حماية تامة للبيانات)
        const STORAGE_KEY = 'hesabat_app_data_v1';
        
        let db = {
            person: "",
            target: 0,
            profit: "",
            payments: []
        };

        function loadData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    db = JSON.parse(saved);
                }
            } catch (e) {
                console.error("خطأ في استرجاع البيانات:", e);
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
                // نسخة احتياطية ثانية تلقائية لضمان عدم الضياع نهائياً
                sessionStorage.setItem(STORAGE_KEY + '_backup', JSON.stringify(db));
                render();
            } catch (e) {
                alert("تعذر الحفظ، يرجى التأكد من مساحة التخزين على الجهاز.");
            }
        }

        loadData();

        // حساب الأيام المتبقية لرمضان القادم (رمضان 1448 هـ / فبراير 2027)
        function calculateDaysToRamadan() {
            const ramadanDate = new Date('2027-02-08');
            const today = new Date();
            const diffTime = ramadanDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays > 0 ? diffDays : 0;
        }

        // رسم الواجهة وتحديث الأرقام فورياً
        function render() {
            // العنوان
            document.getElementById('person-title').innerText = db.person ? `حسابات: ${db.person}` : "حسابات";

            // إجمالي الدفعات
            let total = db.payments.reduce((sum, item) => sum + Number(item.amount), 0);
            document.getElementById('total-amount').innerHTML = `${total.toLocaleString()} <span style="font-size: 1.2rem;">ر.س</span>`;

            // المتبقي لرمضان
            document.getElementById('days-to-ramadan').innerText = `${calculateDaysToRamadan()} يوم`;

            // الهدف
            let target = Number(db.target) || 0;
            document.getElementById('target-display').innerHTML = `${target.toLocaleString()} <span style="font-size: 0.8rem;">ر.س</span>`;

            // المتبقي للهدف
            let remaining = target - total;
            document.getElementById('remaining-to-target').innerText = `${remaining > 0 ? remaining.toLocaleString() : 0} ر.س`;

            // الربح المتوقع
            const profitSection = document.getElementById('profit-section');
            if (db.profit && db.profit.trim() !== "") {
                profitSection.style.display = 'block';
                let calculatedProfit = 0;
                if (db.profit.includes('%')) {
                    let percentage = parseFloat(db.profit.replace('%', ''));
                    calculatedProfit = total * (percentage / 100);
                } else {
                    calculatedProfit = parseFloat(db.profit) || 0;
                }
                document.getElementById('expected-profit').innerText = `${calculatedProfit.toLocaleString()} ر.س`;
                document.getElementById('final-expected-amount').innerText = `${(total + calculatedProfit).toLocaleString()} ر.س`;
            } else {
                profitSection.style.display = 'none';
            }

            // قائمة الدفعات
            const listEl = document.getElementById('payments-list');
            listEl.innerHTML = '';

            if (!db.payments || db.payments.length === 0) {
                listEl.innerHTML = `<div class="empty-state">لا توجد دفعات مسجلة حتى الآن</div>`;
                return;
            }

            let sortedPayments = [...db.payments].sort((a, b) => new Date(b.date) - new Date(a.date));

            sortedPayments.forEach((p) => {
                let formattedDate = new Date(p.date).toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });
                let itemHTML = `
                    <div class="payment-item">
                        <div class="payment-info">
                            <div class="amount">${Number(p.amount).toLocaleString()} ر.س</div>
                            <div class="note">${p.note || 'بدون ملاحظة'}</div>
                            <div class="date">${formattedDate}</div>
                        </div>
                        <div class="payment-actions">
                            <button class="action-btn edit-btn" onclick="editPayment('${p.id}')">✏️</button>
                            <button class="action-btn delete-btn" onclick="deletePayment('${p.id}')">🗑️</button>
                        </div>
                    </div>
                `;
                listEl.innerHTML += itemHTML;
            });
        }

        // النوافذ المنبثقة
        function openAddModal() {
            document.getElementById('modal-title').innerText = "إضافة دفعة جديدة";
            document.getElementById('payment-id').value = '';
            document.getElementById('pay-amount').value = '';
            document.getElementById('pay-note').value = '';
            document.getElementById('pay-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('payment-modal').classList.add('active');
        }

        function closePaymentModal() {
            document.getElementById('payment-modal').classList.remove('active');
        }

        function openSettings() {
            document.getElementById('set-person').value = db.person || '';
            document.getElementById('set-target').value = db.target || '';
            document.getElementById('set-profit').value = db.profit || '';
            document.getElementById('settings-modal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        // العمليات (حفظ، تعديل، حذف)
        function savePayment(e) {
            e.preventDefault();
            let id = document.getElementById('payment-id').value;
            let amount = document.getElementById('pay-amount').value;
            let date = document.getElementById('pay-date').value;
            let note = document.getElementById('pay-note').value;

            if (id) {
                let p = db.payments.find(item => item.id == id);
                if (p) {
                    p.amount = amount;
                    p.date = date;
                    p.note = note;
                }
            } else {
                let newPayment = {
                    id: Date.now().toString(),
                    amount: amount,
                    date: date,
                    note: note
                };
                if (!db.payments) db.payments = [];
                db.payments.push(newPayment);
            }

            saveData();
            closePaymentModal();
        }

        function editPayment(id) {
            let p = db.payments.find(item => item.id == id);
            if (p) {
                document.getElementById('modal-title').innerText = "تعديل الدفعة";
                document.getElementById('payment-id').value = p.id;
                document.getElementById('pay-amount').value = p.amount;
                document.getElementById('pay-date').value = p.date;
                document.getElementById('pay-note').value = p.note || '';
                document.getElementById('payment-modal').classList.add('active');
            }
        }

        function deletePayment(id) {
            if (confirm("هل أنت متأكد من حذف هذه الدفعة؟")) {
                db.payments = db.payments.filter(item => item.id != id);
                saveData();
            }
        }

        function saveSettings(e) {
            e.preventDefault();
            db.person = document.getElementById('set-person').value;
            db.target = document.getElementById('set-target').value;
            db.profit = document.getElementById('set-profit').value;
            saveData();
            closeSettings();
        }

        // التشغيل الأولي وضمان الاسترجاع الفوري
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            render();
        });
    </script>
</body>
</html>
